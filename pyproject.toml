[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "descompactador"
version = "0.1.0"
description = "Extrai vários arquivos compactados na mesma pasta, mesclando diretórios"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.5"]

[project.gui-scripts]
descompactador = "descompactador.__main__:main"

[tool.setuptools]
packages = ["descompactador", "descompactador.gui"]
